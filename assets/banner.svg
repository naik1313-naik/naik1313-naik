<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g opacity="0.05" stroke="#e2e8f0">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300"/>
  </g>

  <circle cx="1100" cy="40" r="120" fill="#22d3ee" opacity="0.08"/>
  <circle cx="80" cy="260" r="140" fill="#a78bfa" opacity="0.08"/>
  <circle cx="620" cy="20" r="40" fill="#f472b6" opacity="0.06"/>
  <circle cx="1140" cy="280" r="10" fill="#a78bfa" opacity="0.5"/>
  <circle cx="100" cy="60" r="7" fill="#22d3ee" opacity="0.5"/>
  <circle cx="980" cy="160" r="5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="220" cy="220" r="6" fill="#f472b6" opacity="0.4"/>

  <text x="80" y="130" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" filter="url(#glow)">Sumeet Naik</text>

  <text x="80" y="180" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#accent)">Full-Stack &middot; AI/ML &middot; Creative Frontend</text>

  <text x="80" y="225" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">
    Building complete products &mdash; from JWT-secured APIs to scroll-driven Three.js experiences.
  </text>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="80" y="245" width="118" height="34" rx="17" fill="#22d3ee" opacity="0.12"/>
    <text x="93" y="266" fill="#67e8f9">github.com/naik1313-naik</text>

    <rect x="216" y="245" width="132" height="34" rx="17" fill="#a78bfa" opacity="0.15"/>
    <text x="229" y="266" fill="#c4b5fd">Bengaluru, India</text>

    <rect x="366" y="245" width="118" height="34" rx="17" fill="#f472b6" opacity="0.15"/>
    <text x="379" y="266" fill="#f9a8d4">Open to work</text>
  </g>
</svg>